<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="card">
        <div class="imgBox">
            <div class="bark"></div>
            <img src="./hbd.avif" alt="Happy Birthday">
        </div>

        <div class="details">
            <h4 class="color1">Happy Birthday!</h4>
            <h4 class="color2 margin">(Eleven)</h4>

            <p>Dear El,</p>
            <p>Go ahead and live with</p>
            <p>your head held high.</p>
            <p>No matter how devastated</p>
            <p>you may be by your own</p>
            <p>weakness or uselessness...</p>
            <p>Grit your teeth and look </p>
            <p> look straight ahead.</p>

            <p class="text-right">Keep fighting!</p>
            <p class="text-right">Mike is still here</p>
        </div>
    </div>

</body>
</html>
